name: Bug Report
description: Report a bug or unexpected behaviour in losql
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **losql**! Please share enough detail to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the unexpected behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, SQL statement, or key sequence to reproduce the issue (e.g. against `losql demo`).
      placeholder: |
        1. Run `losql demo`
        2. Press `...`
    validations:
      required: true
  - type: dropdown
    id: dialect
    attributes:
      label: Database dialect
      options:
        - SQLite (or bundled demo)
        - PostgreSQL
        - Not applicable / UI only
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "`losql --version`, OS, terminal emulator, and Agent Provider (if relevant)"
      placeholder: "losql 0.2.0, Arch Linux (Omarchy), Ghostty, OpenCode"
    validations:
      required: true
